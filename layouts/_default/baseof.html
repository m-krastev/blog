<!doctype html>
<html lang="{{ site.LanguageCode }}">
<head>
  {{ partial "head.html" . }}
</head>
<body>
  <header class="site-header"><div class="wrap">
    <a class="brand" href="{{ "/" | relURL }}">{{ site.Title }}</a>
    <nav>
      {{- range site.Menus.main }}
      <a href="{{ .URL }}">{{ .Name }}</a>
      {{- end }}
    </nav>
  </div></header>
  {{ block "main" . }}{{ end }}
  <footer class="site-footer"><div class="wrap">
    © {{ now.Year }} {{ site.Params.author }} · <a href="{{ site.Params.mainSite }}">krastev.dev</a> · <a href="{{ "feed.xml" | absURL }}">RSS</a>
  </div></footer>
</body>
</html>
